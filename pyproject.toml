[project]
name = "data-pipeline-portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.68",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "retrying>=1.4.2",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest-mock>=3.15.1",
    "responses>=0.26.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
